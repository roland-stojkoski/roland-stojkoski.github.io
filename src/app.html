<!doctype html>
<html lang="en" data-theme="latte">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set theme before first paint to avoid a flash of the wrong theme.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme =
						stored === 'latte' || stored === 'espresso' ? stored : dark ? 'espresso' : 'latte';
					document.documentElement.setAttribute('data-theme', theme);
					if (localStorage.getItem('a11y-dyslexic') === 'true')
						document.documentElement.classList.add('dyslexic-font');
				} catch (e) {
					/* no-op: default theme from markup applies */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
