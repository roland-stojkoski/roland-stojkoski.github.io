name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify node pins agree
        run: |
          mise_node="$(sed -n 's/^node[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' mise.toml)"
          pinned="$(tr -d '[:space:]' < .node-version)"
          if [ -z "$mise_node" ]; then
            echo "::error file=mise.toml::could not read the node pin from [tools]"
            exit 1
          fi
          if [ "$mise_node" != "$pinned" ]; then
            echo "::error file=mise.toml::mise.toml pins node $mise_node but .node-version pins $pinned"
            exit 1
          fi
          echo "node pinned at $pinned"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run planned:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build
      - run: npm run build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
